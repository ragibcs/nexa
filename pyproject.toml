[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa"
version = "0.1.0"
description = "Enhanced Headless Face Swapper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "imageio[ffmpeg]>=2.34.1",
    "ffmpeg-python>=0.2.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.1",
    "opencv-python-headless>=4.9.0.80",
    "requests>=2.31.0",
    "tqdm>=4.66.2",
    "numpy>=1.26.4",
    "gfpgan>=1.3.8",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.27.2",
    "transformers>=4.38.2",
    "accelerate>=0.27.2",
    "huggingface_hub>=0.21.4",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17.1"]

[project.scripts]
nexa = "nexa.main:app"

[tool.setuptools.packages.find]
where = ["src"]
